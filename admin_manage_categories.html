      var path = window.location.pathname.split('/').pop();

        if (link.getAttribute('href') === path) link.classList.add('active');

  <div class="container mt-4">
    <h1 class="mb-4">Manage Categories</h1>
    <button class="btn btn-primary mb-3" onclick="showCategoryModal()">Add Category</button>
    <div id="category-management"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', fetchCategories);

    function fetchCategories() {
      fetch('admin_categories/list.php')
        .then(res => res.json())
        .then(data => renderCategories(data))
        .catch(() => {
          document.getElementById('category-management').innerHTML = '<div class="alert alert-danger">Error loading categories.</div>';
        });
    }

    function renderCategories(data) {
      const categories = data.categories || [];
      let html = `
        <table class="table table-bordered">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Description</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${categories.map(cat => `
              <tr>
                <td>${cat.category_id}</td>
                <td>${cat.name}</td>
                <td>${cat.description || ''}</td>
                <td><span class="badge bg-${cat.status === 'active' ? 'success' : 'secondary'}">${cat.status}</span></td>
                <td>
                  <button class="btn btn-sm btn-warning" onclick='showCategoryModal(${JSON.stringify(cat)})'>Edit</button>
                  <button class="btn btn-sm btn-danger" onclick="deleteCategory(${cat.category_id})">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      document.getElementById('category-management').innerHTML = html;
    }

    window.showCategoryModal = function(category) {
      let modalHtml = `
        <div class="modal fade" id="categoryModal" tabindex="-1">
          <div class="modal-dialog">
            <div class="modal-content">
              <form id="categoryForm">
                <div class="modal-header">
                  <h5 class="modal-title">${category ? 'Edit' : 'Add'} Category</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                  <input type="hidden" id="categoryId" value="${category?.category_id || ''}">
                  <div class="mb-2">
                    <label>Name</label>
                    <input type="text" class="form-control" id="categoryName" value="${category?.name || ''}" required>
                  </div>
                  <div class="mb-2">
                    <label>Description</label>
                    <textarea class="form-control" id="categoryDescription">${category?.description || ''}</textarea>
                  </div>
                  <div class="mb-2">
                    <label>Status</label>
                    <select class="form-control" id="categoryStatus">
                      <option value="active" ${category?.status === 'active' ? 'selected' : ''}>Active</option>
                      <option value="inactive" ${category?.status === 'inactive' ? 'selected' : ''}>Inactive</option>
                    </select>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Save</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      `;
      let oldModal = document.getElementById('categoryModal');
      if (oldModal) oldModal.remove();
      document.body.insertAdjacentHTML('beforeend', modalHtml);
      let modal = new bootstrap.Modal(document.getElementById('categoryModal'));
      modal.show();

      document.getElementById('categoryForm').onsubmit = function(e) {
        e.preventDefault();
        const id = document.getElementById('categoryId').value;
        const payload = {
          name: document.getElementById('categoryName').value,
          description: document.getElementById('categoryDescription').value,
          status: document.getElementById('categoryStatus').value
        };
        if (id) payload.id = id;
        let url = 'admin_categories/list.php';
        if (id) url = 'admin_categories/edit.php';
        fetch(url, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
          if (data.success || data.success === true) {
            bootstrap.Modal.getInstance(document.getElementById('categoryModal')).hide();
            fetchCategories();
          } else {
            alert(data.error || 'Failed to save category.');
          }
        })
        .catch(() => alert('Network error.'));
      };
    };

    window.deleteCategory = function(id) {
      if (!confirm('Delete this category?')) return;
      fetch('admin_categories/delete.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id: id})
      })
      .then(res => res.json())
      .then(data => {
        if (data.success || data.success === true) {
          fetchCategories();
        } else {
          alert(data.error || 'Failed to delete category.');
        }
      })
      .catch(() => alert('Network error.'));
    };
  </script>
<script src="auto_refresh.js"></script>
</body>
</html>
