  <div class="container mt-4">
    <h1 class="mb-4">Manage Products</h1>
    <div class="row mb-3">
      <div class="col-md-4">
        <input type="text" class="form-control" id="productSearch" placeholder="Search products...">
      </div>
    </div>
    <div id="product-management"></div>
    <nav id="productPagination" aria-label="Products pagination"></nav>
  </div>

  <!-- Edit Product Modal -->
  <div class="modal fade" id="editProductModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="editAlert"></div>
          <input type="hidden" id="editProductId">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" id="editName">
          </div>
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">Price</label>
              <input type="number" step="0.01" class="form-control" id="editPrice">
            </div>
            <div class="col-md-6">
              <label class="form-label">Category ID</label>
              <input type="number" class="form-control" id="editCategory">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Stock</label>
            <input type="number" class="form-control" id="editStock">
          </div>
          <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" id="editStatus">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Image URL</label>
            <input type="text" class="form-control" id="editImageUrl">
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="editDescription" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveProductBtn" onclick="saveProduct()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      let currentProductPage = 1;
      const productLimit = 10;

      function fetchProducts(page = 1) {
        const search = document.getElementById('productSearch')?.value?.trim() || '';
        const url = `admin_products/list.php?page=${page}&limit=${productLimit}&search=${encodeURIComponent(search)}`;
        fetch(url)
          .then(res => {
            if (!res.ok) throw new Error('Failed to fetch products');
            return res.json();
          })
          .then(renderProducts)
          .catch(() => {
            document.getElementById('product-management').innerHTML = '<div class="alert alert-danger">Error loading products.</div>';
          });
      }

      function renderProducts(response) {
        const products = response.products || [];
        const pagination = response.pagination || {};
        currentProductPage = pagination.page || 1;
        const totalPages = pagination.total_pages || 1;

        let html = `
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Store Name</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Status</th>
                <th>Image</th>
                <th>⭐ Featured</th>
                <th>Featured Order</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${products.map(product => `
                <tr>
                  <td>${product.id || product.product_id}</td>
                  <td>${product.name}</td>
                   <td>${product.category || product.category_id || ''}</td>
                   <td>${product.store_name || product.seller || ''}</td>
                   <td>$${product.price ? Number(product.price).toFixed(2) : '0.00'}</td>
                  <td>${product.stock || 0}</td>
                  <td>
                    <span class="badge bg-${product.status === 'active' ? 'success' : 'secondary'}">
                      ${product.status ? product.status.charAt(0).toUpperCase() + product.status.slice(1) : 'Unknown'}
                    </span>
                  </td>
                  <td>${product.image_url ? `<img src="${product.image_url}" style="width:50px;">` : ''}</td>
                  <td>
                    <button class="btn btn-sm ${product.featured ? 'btn-warning' : 'btn-outline-warning'}" onclick="toggleFeatured(${product.id || product.product_id}, ${product.featured ? 1 : 0})">
                      ${product.featured ? '⭐ Featured' : 'Feature'}
                    </button>
                  </td>
                  <td>${product.featured_order || '-'}</td>
                  <td>
                    <button class="btn btn-sm btn-warning" onclick='showProductModal(${JSON.stringify(product).replace(/'/g, "&#39;")})'>Edit</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteProduct(${product.id || product.product_id})">Delete</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <div class="d-flex justify-content-between align-items-center mt-3">
            <button class="btn btn-outline-primary" ${currentProductPage <= 1 ? 'disabled' : ''} onclick="changeProductPage(${currentProductPage - 1})">Previous</button>
            <span class="text-muted">Page ${currentProductPage} of ${totalPages} (${pagination.total || 0} total)</span>
            <button class="btn btn-outline-primary" ${currentProductPage >= totalPages ? 'disabled' : ''} onclick="changeProductPage(${currentProductPage + 1})">Next</button>
          </div>
        `;
        document.getElementById('product-management').innerHTML = html;
      }

      window.changeProductPage = function (page) {
        fetchProducts(page);
      };

      document.getElementById('productSearch')?.addEventListener('input', function () {
        fetchProducts(1);
      });

      window.deleteProduct = function (id) {
        if (!confirm('Delete this product?')) return;
        fetch('admin_products/delete.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ product_id: id })
        })
          .then(res => res.json())
          .then(() => fetchProducts(currentProductPage))
          .catch(() => alert('Failed to delete product.'));
      };

      window.toggleFeatured = function (productId, currentFeatured) {
        const newFeatured = currentFeatured ? 0 : 1;
        const sortOrder = newFeatured ? 0 : -1;
        fetch('admin_products/feature.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ product_id: productId, sort_order: sortOrder })
        })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              fetchProducts(currentProductPage);
            } else {
              alert(data.error || 'Failed to update featured status.');
            }
          })
          .catch(() => alert('Network error.'));
      };

      window.showProductModal = function (product) {
        document.getElementById('editAlert').innerHTML = '';
        document.getElementById('editProductId').value = product.id || product.product_id;
        document.getElementById('editName').value = product.name || '';
        document.getElementById('editPrice').value = product.price || 0;
        document.getElementById('editCategory').value = product.category_id || '';
        document.getElementById('editStock').value = product.stock || 0;
        document.getElementById('editStatus').value = product.status || 'active';
        document.getElementById('editImageUrl').value = product.image_url || '';
        document.getElementById('editDescription').value = product.description || '';
        const modal = new bootstrap.Modal(document.getElementById('editProductModal'));
        modal.show();
      };

      window.saveProduct = function () {
        const alertBox = document.getElementById('editAlert');
        alertBox.innerHTML = '';
        const payload = {
          product_id: document.getElementById('editProductId').value,
          name: document.getElementById('editName').value.trim(),
          price: parseFloat(document.getElementById('editPrice').value) || 0,
          category_id: parseInt(document.getElementById('editCategory').value, 10) || null,
          stock: parseInt(document.getElementById('editStock').value, 10) || 0,
          status: document.getElementById('editStatus').value,
          image_url: document.getElementById('editImageUrl').value.trim() || null,
          description: document.getElementById('editDescription').value.trim()
        };
        fetch('admin_products/edit.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              bootstrap.Modal.getInstance(document.getElementById('editProductModal')).hide();
              fetchProducts(currentProductPage);
            } else {
              alertBox.innerHTML = '<div class="alert alert-danger">' + (data.error || 'Update failed.') + '</div>';
            }
          })
          .catch(() => {
            alertBox.innerHTML = '<div class="alert alert-danger">Network error.</div>';
          });
      };

      fetchProducts();
    });
  </script>
  <script src="auto_refresh.js"></script>
</body>
</html>
