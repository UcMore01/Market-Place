  <div class="container mt-4">
    <h1 class="mb-4">Manage Sellers</h1>
    <div class="row mb-3">
      <div class="col-md-4">
        <input type="text" class="form-control" id="sellerSearch" placeholder="Search sellers...">
      </div>
    </div>
    <div id="seller-management"></div>
    <nav id="sellerPagination" aria-label="Sellers pagination"></nav>
  </div>

  <!-- Edit Seller Modal -->
  <div class="modal fade" id="editSellerModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editSellerForm">
          <div class="modal-header">
            <h5 class="modal-title">Edit Seller</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editSellerId">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" id="editSellerName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="editSellerEmail" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Shop Name</label>
              <input type="text" class="form-control" id="editSellerShop">
            </div>
            <div class="mb-3">
              <label class="form-label">Status</label>
              <select class="form-select" id="editSellerStatus">
                <option value="active">Active</option>
                <option value="pending">Pending</option>
                <option value="blocked">Blocked</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Quick Top Seller Toggle Modal -->
  <div class="modal fade" id="topSellerModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="topSellerForm">
          <div class="modal-header">
            <h5 class="modal-title">Manage Top Seller</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="topSellerId">
            <div class="mb-3">
              <label class="form-label">Seller</label>
              <input type="text" class="form-control" id="topSellerName" readonly>
            </div>
            <div class="mb-3 form-check form-switch">
              <input class="form-check-input" type="checkbox" id="isTopSeller" value="1">
              <label class="form-check-label fw-bold">⭐ Top Seller</label>
            </div>
            <div class="mb-3">
              <label class="form-label">Featured Order (lower = higher priority)</label>
              <input type="number" class="form-control" id="featuredOrder" min="0" value="0">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // State
      let currentSellerPage = 1;
      const sellerLimit = 10;


      window.fetchSellers = function(page = 1) {
        const search = document.getElementById('sellerSearch')?.value?.trim() || '';
        const url = `admin_sellers/list.php?page=${page}&limit=${sellerLimit}&search=${encodeURIComponent(search)}`;
        fetch(url, { credentials: 'same-origin' })
          .then(res => {
            if (!res.ok) throw new Error('Failed to fetch sellers (' + res.status + ')');
            return res.json();
          })
          .then(response => renderSellers(response))
          .catch(err => {
            document.getElementById('seller-management').innerHTML = '<div class="alert alert-danger">Error loading sellers: ' + (err && err.message ? err.message : 'unknown error') + '</div>';
          });
      }

      function renderSellers(response) {
        const sellers = response.sellers || [];
        const pagination = response.pagination || {};
        currentSellerPage = pagination.page || 1;
        const totalPages = pagination.total_pages || 1;

        let html = `
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Shop Name</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${sellers.map(seller => `
                <tr>
                  <td>${seller.user_id}</td>
                  <td>${seller.fullname}</td>
                  <td>${seller.email}</td>
                  <td>${seller.store_name || ''}</td>
                  <td>
                    <span class="badge bg-${seller.status === 'active' ? 'success' : seller.status === 'blocked' ? 'danger' : 'secondary'}">
                      ${seller.status ? seller.status.charAt(0).toUpperCase() + seller.status.slice(1) : 'Unknown'}
                    </span>
                  </td>
                  <td>
                    <button class="btn btn-sm btn-warning" onclick='showSellerModal(${JSON.stringify(seller)})'>Edit</button>
                    <button class="btn btn-sm ${seller.is_top_seller ? 'btn-warning' : 'btn-outline-warning'} mt-1" onclick="openTopSellerModal(${seller.user_id}, '${seller.fullname || seller.username}', ${seller.is_top_seller || 0}, ${seller.featured_order || 0})">
                      ${seller.is_top_seller ? '⭐ Top Seller' : 'Make Top Seller'}
                    </button>
                    ${seller.status === 'pending' ? 
                      `<button class="btn btn-sm btn-success" onclick="approveSeller(${seller.user_id})">Approve</button>` : ''}
                    ${seller.status === 'active' ? 
                      `<button class="btn btn-sm btn-danger" onclick="blockSeller(${seller.user_id})">Block</button>` : ''}
                    ${seller.status === 'blocked' ? 
                      `<button class="btn btn-sm btn-success" onclick="unblockSeller(${seller.user_id})">Unblock</button>` : ''}
                    <button class="btn btn-sm btn-danger mt-1" onclick="deleteSeller(${seller.user_id})">Delete</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <div class="d-flex justify-content-between align-items-center mt-3">
            <button class="btn btn-outline-primary" ${currentSellerPage <= 1 ? 'disabled' : ''} onclick="changeSellerPage(${currentSellerPage - 1})">Previous</button>
            <span class="text-muted">Page ${currentSellerPage} of ${totalPages} (${pagination.total || 0} total)</span>
            <button class="btn btn-outline-primary" ${currentSellerPage >= totalPages ? 'disabled' : ''} onclick="changeSellerPage(${currentSellerPage + 1})">Next</button>
          </div>
        `;
        document.getElementById('seller-management').innerHTML = html;
      }

      window.changeSellerPage = function(page) {
        fetchSellers(page);
      };

      document.getElementById('sellerSearch')?.addEventListener('input', function() {
        fetchSellers(1);
      });

      fetchSellers();
    });

    async function apiAction(url, userId, confirmMsg) {
      if (confirmMsg && !confirm(confirmMsg)) return;
      try {
        const res = await fetch(url, {
          method: 'POST',
          credentials: 'same-origin',
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body: 'user_id=' + encodeURIComponent(userId)
        });
        let data = {};
        try { data = await res.json(); } catch (e) { data = {}; }
        if (res.ok && data.success) {
          fetchSellers();
        } else {
          alert(data.error || data.message || ('Request failed (' + res.status + ')'));
        }
      } catch (e) {
        alert('Network error: ' + e.message);
      }
    }

    window.approveSeller = function(userId) { apiAction('admin_sellers/approve.php', userId); };
    window.blockSeller = function(userId) { apiAction('admin_sellers/block.php', userId); };
    window.unblockSeller = function(userId) { apiAction('admin_sellers/unblock.php', userId); };
    window.deleteSeller = function(userId) { apiAction('admin_sellers/delete.php', userId, 'Delete this seller? This cannot be undone.'); };

    window.openTopSellerModal = function(userId, fullname, isTopSeller, featuredOrder) {
      document.getElementById('topSellerId').value = userId;
      document.getElementById('topSellerName').value = fullname;
      document.getElementById('isTopSeller').checked = !!isTopSeller;
      document.getElementById('featuredOrder').value = featuredOrder || 0;
      new bootstrap.Modal(document.getElementById('topSellerModal')).show();
    };

    window.showSellerModal = function(seller) {
      document.getElementById('editSellerId').value = seller.user_id;
      document.getElementById('editSellerName').value = seller.fullname || '';
      document.getElementById('editSellerEmail').value = seller.email || '';
      document.getElementById('editSellerShop').value = seller.store_name || seller.shop_name || '';
      document.getElementById('editSellerStatus').value = seller.status === 'active' || seller.status === 'pending' || seller.status === 'blocked' ? seller.status : 'pending';
      new bootstrap.Modal(document.getElementById('editSellerModal')).show();
    };

    document.getElementById('editSellerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const id = document.getElementById('editSellerId').value;
      const fullname = document.getElementById('editSellerName').value.trim();
      const email = document.getElementById('editSellerEmail').value.trim();
      const shop_name = document.getElementById('editSellerShop').value.trim();
      const status = document.getElementById('editSellerStatus').value;

      fetch('admin_sellers/edit.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: `id=${encodeURIComponent(id)}&fullname=${encodeURIComponent(fullname)}&email=${encodeURIComponent(email)}&shop_name=${encodeURIComponent(shop_name)}&status=${encodeURIComponent(status)}`
      })
      .then(res => res.json())
      .then(data => {
        if (data.success || data.success === true) {
          alert('Seller updated successfully.');
          bootstrap.Modal.getInstance(document.getElementById('editSellerModal')).hide();
          fetchSellers();
        } else {
          alert(data.error || 'Failed to update seller.');
        }
      })
      .catch(() => alert('Network error.'));
    });

    document.getElementById('topSellerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const userId = document.getElementById('topSellerId').value;
      const isTopSeller = document.getElementById('isTopSeller').checked ? 1 : 0;
      const featuredOrder = parseInt(document.getElementById('featuredOrder').value) || 0;

      fetch('admin_sellers/feature.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: `user_id=${encodeURIComponent(userId)}&is_top_seller=${isTopSeller}&featured_order=${featuredOrder}`
      })
      .then(res => res.json())
      .then(data => {
        if (data.success || data.success === true) {
          alert('Top seller settings updated.');
          fetchSellers();
        } else {
          alert(data.error || 'Failed to update.');
        }
      })
      .catch(() => alert('Network error.'));
    });
  </script>
  <script src="auto_refresh.js"></script>
</body>
