  <div class="container mt-4">
    <h1 class="mb-4">Manage Users</h1>
    <div class="row mb-3">
      <div class="col-md-4">
        <input type="text" class="form-control" id="userSearch" placeholder="Search users by name, email, or username...">
      </div>
      <div class="col-md-8 text-end">

  <div class="modal fade" id="addAdminModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="addAdminForm" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Admin</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" name="fullname" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" name="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" minlength="6" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Role</label>
            <select class="form-select" name="role">
              <option value="admin">Admin</option>
            </select>
          </div>
          <div id="addAdminResult"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Admin</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (async function() {
      try {
        const res = await fetch('csrf_token.php', { credentials: 'same-origin' });
        const data = await res.json();
        if (data.csrf_token) {
          window.__csrfToken = data.csrf_token;
        }
      } catch (e) { console.error('Failed to load CSRF token'); }
    })();

    document.getElementById('addAdminForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const result = document.getElementById('addAdminResult');
      result.innerHTML = '<div class="text-primary">Creating...</div>';
      const form = e.target;
      const payload = {
        fullname: form.fullname.value.trim(),
        username: form.username.value.trim(),
        email: form.email.value.trim(),
        password: form.password.value,
        role: form.role.value,
        csrf_token: window.__csrfToken || ''
      };
      try {
        const res = await fetch('admin_api/register.php', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.status === 'success') {
          result.innerHTML = '<div class="alert alert-success">' + data.message + '</div>';
          form.reset();
          setTimeout(() => {
            bootstrap.Modal.getInstance(document.getElementById('addAdminModal'))?.hide();
          }, 1200);
        } else {
          result.innerHTML = '<div class="alert alert-danger">' + (data.message || 'Failed to create admin.') + '</div>';
        }
      } catch (err) {
        result.innerHTML = '<div class="alert alert-danger">Request failed.</div>';
      }
    });
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      let currentUserPage = 1;
      const userLimit = 10;

      fetchUsers();

      function fetchUsers(page = 1) {
        const search = document.getElementById('userSearch')?.value?.trim() || '';
        const url =
          `admin_users/list.php?page=${page}&limit=${userLimit}&search=${encodeURIComponent(search)}`;
        fetch(url)
          .then(res => {
            if (!res.ok) throw new Error('Failed to fetch users');
            return res.json();
          })
          .then(data => renderUsers(data))
          .catch(() => {
            document.getElementById('user-management').innerHTML = '<div class="alert alert-danger">Error loading users.</div>';
          });
      }

      function renderUsers(response) {
        const users = response.users || [];
        const pagination = response.pagination || {};
        currentUserPage = pagination.page || 1;
        const totalPages = pagination.total_pages || 1;

        let html = `
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Username</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${users.map(user => `
                <tr>
                  <td>${user.user_id}</td>
                  <td>${user.fullname}</td>
                  <td>${user.email}</td>
                  <td>${user.username}</td>
                  <td>
                    <span class="badge bg-${user.status === 'active' ? 'success' : user.status === 'banned' ? 'danger' : 'secondary'}">
                      ${user.status ? user.status.charAt(0).toUpperCase() + user.status.slice(1) : 'Unknown'}
                    </span>
                  </td>
                  <td>
                    <button class="btn btn-sm btn-warning" onclick='editUser(${JSON.stringify(user)})'>Edit</button>
                    ${user.status === 'active'
                      ? `<button class="btn btn-sm btn-danger" onclick="banUser(${user.user_id})">Ban</button>`
                      : `<button class="btn btn-sm btn-success" onclick="unbanUser(${user.user_id})">Unban</button>`
                    }
                    <button class="btn btn-sm btn-danger" onclick="deleteUser(${user.user_id})">Delete</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <div class="d-flex justify-content-between align-items-center mt-3">
            <button class="btn btn-outline-primary" ${currentUserPage <= 1 ? 'disabled' : ''} onclick="changeUserPage(${currentUserPage - 1})">Previous</button>
            <span class="text-muted">Page ${currentUserPage} of ${totalPages} (${pagination.total || 0} total)</span>
            <button class="btn btn-outline-primary" ${currentUserPage >= totalPages ? 'disabled' : ''} onclick="changeUserPage(${currentUserPage + 1})">Next</button>
          </div>
        `;
        document.getElementById('user-management').innerHTML = html;
      }

      window.changeUserPage = function(page) {
        fetchUsers(page);
      };

      document.getElementById('userSearch')?.addEventListener('input', function() {
        fetchUsers(1);
      });

      fetchUsers();

      window.editUser = function(user) {
        const fullname = prompt('Full Name:', user.fullname || '');
        if (fullname === null) return;
        const email = prompt('Email:', user.email || '');
        if (email === null) return;
        fetch('admin_users/edit.php', {
          method: 'POST',
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body: 'id=' + encodeURIComponent(user.user_id) +
                '&fullname=' + encodeURIComponent(fullname) +
                '&email=' + encodeURIComponent(email)
        })
        .then(res => res.json())
        .then(() => fetchUsers());
      };

      window.banUser = function(id) {
        if (!confirm('Ban this user?')) return;
        fetch('admin_users/ban.php', {
          method: 'POST',
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body: 'id=' + encodeURIComponent(id)
        })
        .then(res => res.json())
        .then(() => fetchUsers());
      };

      window.unbanUser = function(id) {
        if (!confirm('Unban this user?')) return;
        fetch('admin_users/unban.php', {
          method: 'POST',
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body: 'id=' + encodeURIComponent(id)
        })
        .then(res => res.json())
        .then(() => fetchUsers());
      };

      window.deleteUser = function(id) {
        if (!confirm('Delete this user?')) return;
        fetch('admin_users/delete.php', {
          method: 'POST',
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body: 'id=' + encodeURIComponent(id)
        })
        .then(res => res.json())
        .then(() => fetchUsers());
      };
    });
  </script>
